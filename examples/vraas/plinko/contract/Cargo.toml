[package]
name = "plinko-contract"
version = "0.1.0"
authors = ["Ideal Labs <hello@idealabs.network>"]
edition = "2021"

[workspace]

[dependencies]
ink = { version = "5.1.1", default-features = false }
idn-contracts = { version = "0.1.0", default-features = false}

[dev-dependencies]
ink_e2e = { version = "5.1.1" }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "idn-contracts/std",
]
ink-as-dependency = []
e2e-tests = []
