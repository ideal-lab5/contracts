[package]
name = "verifiable-flipper"
version = "0.1.0"
authors = ["[your_name] <[your_email]>"]
edition = "2021"


[dependencies]
ink = { version = "5.1.1", default-features = false }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
sha2 = { version = "0.10.8", default-features = false }
idn-contracts = { path = "../../../../idn-sdk/contracts", default-features = false }
# idn-contracts = { git = "https://github.com/ideal-lab5/idn-sdk.git", default-features = false }
# sp-idn-traits = { git = "https://github.com/ideal-lab5/idn-sdk.git", default-features = false }
frame-support = { version = "40.1.0", default-features = false }

[dev-dependencies]
serde = { version = "1.0", optional = false }
ink_e2e = { version = "5.1.1" }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "scale-info/std",
    "sha2/std",
    "idn-contracts/std",
    # "sp-idn-traits/std",
    "frame-support/std",
]

ink-as-dependency = []
e2e-tests = []
