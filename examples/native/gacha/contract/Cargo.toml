[package]
name = "gacha"
version = "0.1.0"
authors = ["[your_name] <[your_email]>"]
edition = "2021"

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7.4", default-features = false, features = [
    "derive",
] }
ink = { version = "5.1.1", default-features = false } 
idn-contracts = { git = "https://github.com/ideal-lab5/idn-sdk.git", default-features = false }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }

[dev-dependencies]
ink_e2e = { version = "5.1.1" }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = [
    "codec/std",
    "ink/std",
    "idn-contracts/std", 
    "scale-info/std"
]
ink-as-dependency = []
e2e-tests = []
